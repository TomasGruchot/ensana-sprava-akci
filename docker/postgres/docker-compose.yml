name: ensana

services:
  db:
    container_name: ensana-db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ensana}
      POSTGRES_USER: ${POSTGRES_USER:-ensana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ensana} -d ${POSTGRES_DB:-ensana}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
